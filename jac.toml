[project]
name = "planova"
version = "0.1.0"
description = "Planova AI - adaptive AI study planning"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.17"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]
watchdog = ">=3.0.0"

[byllm.model]
default_model = "claude-sonnet-4-6"

[byllm.call_params]
temperature = 0.2
max_tokens = 1200

[placement.pins]
store = "client"

[client]

[client.app_meta_data]
title = "Planova AI"
description = "Plan Smarter. Study Better. Achieve More."
theme_color = "#6D5EF0"

[scale.admin]
enabled = false
